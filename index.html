<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한 달 모험</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--plum:#3d3350;--cream:#fff8e6;--pink:#ff7eb6;--yellow:#ffd84d;--mint:#7fd6b0;--sky1:#9fdcff;--ground:#95da7e;--page-bg:#bfe6ff;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --page-bg:#2b2140; } }
:root[data-theme="dark"]{ --page-bg:#2b2140; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;background:linear-gradient(var(--sky1) 50%,var(--ground) 50%)}
body{margin:0;height:100%;overflow:hidden;background:var(--page-bg);color:var(--plum);
  font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button{font-family:inherit}
#stage{position:relative;height:100%;max-width:480px;margin:0 auto;overflow:hidden;overflow:clip;background:var(--sky1);display:flex;flex-direction:column}
#scene{display:block;width:100%;flex:1;min-height:0}
.hot{cursor:pointer;outline:none}
.hot:focus-visible{filter:drop-shadow(0 0 3px #fff) drop-shadow(0 0 3px var(--pink))}
@keyframes idle{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-4px) scale(.985,1.015)}}
.idle{transform-box:fill-box;transform-origin:50% 100%;animation:idle 2.3s ease-in-out infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2.5deg)}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 4s ease-in-out infinite}
@keyframes drift{from{transform:translateX(-18px)}to{transform:translateX(22px)}}
.cloud{animation:drift 11s ease-in-out infinite alternate}
@keyframes flick{0%,100%{transform:scale(1,1)}50%{transform:scale(1.1,.86)}}
.flick{transform-box:fill-box;transform-origin:50% 100%;animation:flick .45s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(.35);opacity:.2}50%{transform:scale(1);opacity:1}}
.tw{transform-box:fill-box;transform-origin:center;animation:twinkle 2.6s ease-in-out infinite}
@keyframes boing{0%{transform:scale(1,1)}30%{transform:scale(1.07,.9)}55%{transform:scale(.95,1.07)}80%{transform:scale(1.02,.98)}100%{transform:scale(1,1)}}
.boing{transform-box:fill-box;transform-origin:50% 100%;animation:boing .45s ease-out}
@keyframes pop{from{transform:scale(.7) translateY(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes hammer{0%,100%{transform:rotate(-48deg)}45%{transform:rotate(12deg)}60%{transform:rotate(6deg)}}
.hammer{transform-box:fill-box;transform-origin:92% 60%;animation:hammer .7s ease-in-out infinite}
@keyframes spark2{0%,100%{opacity:0;transform:translateY(0)}20%{opacity:1}60%{opacity:.6;transform:translateY(-10px)}}
.spark2{transform-box:fill-box;animation:spark2 .7s ease-out infinite}
@keyframes walkA{0%,100%{transform:translateX(0)}50%{transform:translateX(60px)}}
.walkA{animation:walkA 18s ease-in-out infinite}
@keyframes wag{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
.wag{transform-box:fill-box;transform-origin:0% 100%;animation:wag .3s ease-in-out infinite alternate}
@keyframes bobup{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.bob{animation:bobup 1.1s ease-in-out infinite}
@keyframes fall{from{transform:translate(0,-30px)}to{transform:translate(var(--dx,0px),740px)}}
.fp{animation:fall linear infinite}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important}}
#hud{position:absolute;top:10px;left:10px;right:10px;z-index:5;display:flex;gap:8px;align-items:flex-start;pointer-events:none;flex-wrap:wrap}
.chip{background:var(--cream);border:3px solid var(--plum);border-radius:999px;padding:5px 13px;box-shadow:0 4px 0 var(--plum);font-size:15px;pointer-events:auto}
#hud .grow{flex:1;min-width:150px}
.bar{height:9px;background:#e9dfcf;border:2px solid var(--plum);border-radius:999px;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pink)}
#menu{display:flex;gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.mbtn{flex:1;min-height:58px;border:3px solid var(--plum);border-radius:16px;background:var(--cream);color:var(--plum);box-shadow:0 4px 0 var(--plum);
  font-size:13px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:5px 1px;position:relative}
.mbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--plum)}
.mbtn svg{width:24px;height:24px}
.mbtn .dot{position:absolute;top:-7px;right:-4px;min-width:21px;height:21px;border-radius:999px;background:var(--pink);border:2px solid var(--plum);color:#fff;font-size:12px;line-height:17px;padding:0 3px}
#sheet{position:absolute;inset:0;z-index:20;display:none;align-items:flex-end;justify-content:center;background:rgba(61,51,80,.45);padding:14px 12px}
#sheet.open{display:flex}
.panel{position:relative;width:100%;max-height:86%;display:flex;flex-direction:column;background:var(--cream);border:3px solid var(--plum);
  border-radius:26px;box-shadow:0 6px 0 var(--plum);padding:36px 14px 16px;animation:pop .38s cubic-bezier(.3,1.6,.5,1)}
.ribbon{position:absolute;top:-21px;left:50%;transform:translateX(-50%);color:#fff;white-space:nowrap;border:3px solid var(--plum);border-radius:999px;
  padding:6px 22px 5px;font-size:19px;box-shadow:0 3px 0 var(--plum);text-shadow:0 2px 0 rgba(61,51,80,.35)}
.x{position:absolute;top:-15px;right:-8px;width:42px;height:42px;border-radius:50%;background:#fff;border:3px solid var(--plum);box-shadow:0 3px 0 var(--plum);font-size:19px;color:var(--plum);cursor:pointer;line-height:1}
.body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px}
.sub{margin:0 0 10px;font-size:15px;text-align:center;opacity:.85}
.row{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.btn{border:3px solid var(--plum);border-radius:16px;background:var(--yellow);color:var(--plum);font-size:17px;padding:10px 18px;box-shadow:0 4px 0 var(--plum);cursor:pointer;min-height:48px}
.btn.alt{background:#fff}.btn.pink{background:var(--pink);color:#fff}.btn.sm{min-height:40px;padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default;box-shadow:0 4px 0 rgba(61,51,80,.35)}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--plum)}
.card{background:#fff;border:2.5px solid var(--plum);border-radius:16px;box-shadow:0 3px 0 var(--plum);padding:10px 12px;margin-bottom:10px}
.card.hi{background:#fff3d6}
.card h3{margin:0 0 4px;font-size:17px;font-weight:400}
.card .meta{font-size:13px;opacity:.75;font-family:'Gowun Dodum',sans-serif}
.card .foot{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:8px;flex-wrap:wrap}
.tagline{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.tag{display:inline-flex;align-items:center;gap:4px;background:#fff3d6;border:2px solid var(--plum);border-radius:999px;padding:2px 9px;font-size:13px}
.tag svg{width:16px;height:16px}
.tag.done{background:#dff7e7}.tag.wait{background:#ffe3f0}.tag.lock{background:#eee;opacity:.7}
.opt{display:inline-flex;gap:4px;flex-wrap:wrap}.or{font-size:12px;opacity:.6;margin:0 2px}
.pickrw{display:block;width:100%;text-align:left;cursor:pointer}
.field{display:block;margin-bottom:10px}
.field span{display:block;font-size:14px;margin:0 0 4px 4px}
.field input,.field select,.field textarea{width:100%;border:2.5px solid var(--plum);border-radius:12px;background:#fffdf6;font-family:'Gowun Dodum',sans-serif;
  font-size:16px;padding:10px 12px;color:var(--plum);-webkit-user-select:text;user-select:text}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.slot{position:relative;aspect-ratio:1;border:2.5px solid var(--plum);border-radius:14px;background:#f3e2c3;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;color:var(--plum);font-size:12px;padding:4px;box-shadow:inset 0 -5px 0 rgba(61,51,80,.14)}
.slot svg{width:50%}.slot b{font-weight:400;font-size:13px}.slot.off{opacity:.4}
.plot{background:#e8c79a}
.help{font-family:'Gowun Dodum',sans-serif;font-size:14px;line-height:1.7;background:#fff1c9;border:2px dashed var(--plum);border-radius:14px;padding:10px 12px;word-break:keep-all}
.big{font-size:22px;text-align:center;margin:6px 0}
.pill{display:inline-block;border:2.5px solid var(--plum);border-radius:999px;padding:3px 12px;font-size:14px;background:#fff}
.hrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.sw{width:42px;height:42px;border-radius:50%;border:3px solid var(--plum);box-shadow:0 3px 0 var(--plum);cursor:pointer}
.sw.on{outline:3px solid var(--pink);outline-offset:3px}
.pickrw svg{width:100%;height:72px;display:block}
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tab{flex:1;border:2.5px solid var(--plum);border-radius:14px 14px 8px 8px;background:#f3e2c3;color:var(--plum);font-size:15px;padding:8px 4px;cursor:pointer;min-height:44px}
.tab.on{background:#fff;box-shadow:inset 0 -5px 0 var(--pink)}
.wk{display:flex;align-items:flex-end;gap:10px;height:120px;padding:6px 2px;justify-content:center}
.wk div{flex:1;max-width:46px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:12px}
.wk i{display:block;width:100%;background:var(--mint);border:2.5px solid var(--plum);border-radius:8px 8px 0 0;min-height:4px}
#ask{position:absolute;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;background:rgba(61,51,80,.5);padding:20px}
.askbox{width:100%;max-width:320px;background:var(--cream);border:3px solid var(--plum);border-radius:22px;box-shadow:0 6px 0 var(--plum);padding:20px 16px 16px;text-align:center;animation:pop .3s cubic-bezier(.3,1.6,.5,1)}
.askbox p{margin:0;font-family:'Gowun Dodum',sans-serif;font-size:16px;line-height:1.6;white-space:pre-line;word-break:keep-all}
#toast{position:absolute;left:50%;top:76px;transform:translate(-50%,-14px);z-index:60;opacity:0;pointer-events:none;background:var(--cream);border:3px solid var(--plum);
  border-radius:999px;padding:8px 18px;box-shadow:0 4px 0 var(--plum);font-size:15px;white-space:nowrap;transition:.3s;max-width:92%;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1;transform:translate(-50%,0)}
#gate{position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(61,51,80,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);padding:18px}
.gatecard{width:100%;max-width:340px;background:var(--cream);border:3px solid var(--plum);border-radius:24px;box-shadow:0 6px 0 var(--plum);padding:22px 16px 18px;text-align:center}
.gatecard h1{margin:0 0 4px;font-size:30px;font-weight:400}
.picks{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.pick{background:#fff;border:3px solid var(--plum);border-radius:18px;box-shadow:0 4px 0 var(--plum);padding:8px 6px;cursor:pointer;color:var(--plum);font-size:16px}
.pick svg{width:100%;height:120px;display:block}
#phome{position:absolute;inset:0;z-index:12;overflow-y:auto;background:linear-gradient(#efe6ff,#fff6e8);padding:18px 14px calc(18px + env(safe-area-inset-bottom,0px))}
#phome h1{font-size:26px;font-weight:400;margin:6px 0 2px;text-align:center}
.pwrap{max-width:460px;margin:0 auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div id="stage">
  <svg id="scene" viewBox="0 0 400 700" preserveAspectRatio="xMidYMid meet" aria-label="모험 화면"></svg>
  <div id="hud"></div>
  <div id="menu"></div>
  <div id="sheet"></div>
  <div id="gate"></div>
  <div id="toast" role="status"></div>
  <input id="restore" class="sr" type="file" accept=".json,application/json">
  <input id="proofpick" class="sr" type="file" accept="image/*" capture="environment">
</div>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ========== 기본 데이터 ========== */
const MAT = {
  seed:{name:"씨앗",who:"girl"}, water:{name:"물뿌리개",who:"girl"}, nutri:{name:"영양제",who:"girl"},
  wood:{name:"나무",who:"girl"}, cloth:{name:"천",who:"girl"}, fruit:{name:"열매",who:"girl"},
  stone:{name:"강화석",who:"boy"}, ore:{name:"광석",who:"boy"}, gold:{name:"골드",who:"boy"}, power:{name:"기력",who:"boy"}
};
const DEFAULT_MISSIONS = {
  girl:[
    {title:"아침에 스스로 일어나기",type:"daily",pt:2,rws:[{seed:1},{water:2}]},
    {title:"숙제 끝내기",type:"daily",pt:3,rws:[{water:3},{nutri:1},{cloth:2}]},
    {title:"방 정리하기",type:"daily",pt:2,rws:[{wood:2},{cloth:2}]},
    {title:"책 20분 읽기",type:"daily",pt:3,rws:[{seed:2},{water:3},{nutri:1}]},
    {title:"한 달 동안 줄넘기 10번",type:"monthly",pt:15,rws:[{nutri:3},{wood:5},{cloth:5}]}
  ],
  boy:[
    {title:"아침에 스스로 일어나기",type:"daily",pt:2,rws:[{gold:400},{ore:1}]},
    {title:"숙제 끝내기",type:"daily",pt:3,rws:[{ore:3},{stone:1},{power:1}]},
    {title:"방 정리하기",type:"daily",pt:2,rws:[{gold:500},{ore:2}]},
    {title:"운동 30분",type:"daily",pt:3,rws:[{stone:1},{power:1},{gold:800}]},
    {title:"한 달 동안 단원평가 준비",type:"monthly",pt:15,rws:[{stone:4},{gold:4000},{power:5}]}
  ]
};
const CROPS = [
  {id:"strawberry",name:"딸기",c:"#ff6b6b"},{id:"tomato",name:"토마토",c:"#ff8a3d"},
  {id:"carrot",name:"당근",c:"#ffa24d"},{id:"melon",name:"수박",c:"#6cc26b"}
];
const FURNITURE = [
  {id:"rug",name:"러그",need:{cloth:2,wood:1}},{id:"chair",name:"흔들의자",need:{wood:3}},
  {id:"lamp",name:"전등",need:{wood:2,cloth:1}},{id:"table",name:"티테이블",need:{wood:3,cloth:2}},
  {id:"cat",name:"고양이 쿠션",need:{cloth:4,fruit:2}}
];
const HOUSE_NEED=[null,{wood:4,cloth:2},{wood:6,cloth:4,fruit:3},{wood:10,cloth:6,fruit:6},{wood:14,cloth:10,fruit:10}];
const CASTLE_NEED=[null,{gold:2000,ore:4},{gold:4000,ore:8,stone:1},{gold:7000,ore:12,stone:3},{gold:12000,ore:18,stone:5}];
const CASTLE_DECO=[
  {id:"forgefire",name:"대장간 화로",need:{ore:4,gold:1000}},
  {id:"train",name:"훈련장",need:{ore:6,gold:2000}},
  {id:"tower",name:"망루",need:{stone:1,gold:3000}},
  {id:"vault",name:"보물창고",need:{stone:2,ore:6}},
  {id:"statue",name:"기사 동상",need:{stone:3,gold:5000}}
];
const MONSTERS=[
  {id:"slime",name:"말랑 슬라임",power:2,rw:{gold:300,ore:1}},
  {id:"wolf",name:"바람 늑대",power:5,rw:{gold:600,ore:2}},
  {id:"golem",name:"바위 골렘",power:9,rw:{gold:1000,ore:3,stone:1}},
  {id:"wyvern",name:"하늘 와이번",power:14,rw:{gold:1800,stone:2}}
];
const BOSS={name:"달빛 드래곤",power:18,rw:{gold:5000,stone:5}};
const BOSS_BASE=16, TREE_BASE=5;
const DEFAULT_SHOP=[
  {name:"영화 보기",cost:30},{name:"늦게 자기 30분",cost:15},{name:"외식 메뉴 고르기",cost:20},{name:"용돈 1,000원",cost:25}
];
const SKINS=[{id:"light",c:"#ffe8d8"},{id:"tan",c:"#f2cda9"},{id:"deep",c:"#d6a478"}];
const HAIRC=[{id:"black",n:"흑발",c:"#3f3444"},{id:"brown",n:"갈색",c:"#6b4a3a"},{id:"choco",n:"밝은 갈색",c:"#a3714c"},
  {id:"blonde",n:"금발",c:"#ffd27a"},{id:"pink",n:"핑크",c:"#ff9fbf"},{id:"ash",n:"애쉬",c:"#b9b3c9"}];
const GIRL_HAIR=[{id:"long",n:"긴 생머리"},{id:"twin",n:"양갈래"},{id:"bob",n:"단발"},{id:"pony",n:"포니테일"},{id:"wave",n:"물결 머리"}];
const BOY_HAIR=[{id:"neat",n:"단정하게"},{id:"spike",n:"삐죽삐죽"},{id:"curly",n:"곱슬"},{id:"bowl",n:"앞머리"},{id:"long",n:"장발"}];
const EYES=[{id:"round",n:"동그란 눈"},{id:"sharp",n:"또렷한 눈"},{id:"sleepy",n:"순한 눈"}];
const BREEDS=[
  {id:"maltipoo",n:"말티푸",body:"#dcb083",belly:"#fffaf2",ear:"floppy",tail:"fluff",fluffy:true},
  {id:"pome",n:"포메라니안",body:"#f0a750",belly:"#ffe3bd",ear:"tri",tail:"fluff",fluffy:true},
  {id:"shiba",n:"시바",body:"#f0a55a",belly:"#fff4e4",ear:"tri",tail:"curl",fluffy:false},
  {id:"doxie",n:"닥스훈트",body:"#3a3340",belly:"#d9955b",ear:"long",tail:"straight",fluffy:false},
  {id:"bichon",n:"비숑",body:"#fffaf2",belly:"#fff",ear:"round",tail:"fluff",fluffy:true}
];
const PAY_PRESET={
  boy:{base:30000,bonus:{bronze:0,silver:20000,gold:40000,diamond:60000},need:{silver:120,gold:200,diamond:270},challenge:10000},
  girl:{base:10000,bonus:{bronze:0,silver:20000,gold:40000,diamond:55000},need:{silver:120,gold:200,diamond:270},challenge:5000}
};
const REQ_ITEMS={ girl:[{k:"water",q:3},{k:"nutri",q:1},{k:"seed",q:2}], boy:[{k:"power",q:1},{k:"stone",q:1},{k:"ore",q:3}] };
const REQ_LIMIT=3, HUNT_FREE=2, BOX_RATE=0.25;

const P="#3d3350";
const OL=`stroke="${P}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"`;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const el=h=>{const t=document.createElement("template");t.innerHTML=h.trim();return t.content.firstElementChild;};
const pad=n=>String(n).padStart(2,"0");
const today=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;};
const thisMonth=()=>today().slice(0,7);
const uid2=()=>Math.random().toString(36).slice(2,9);
const won=n=>Number(n||0).toLocaleString("ko-KR")+"원";
const daysInMonth=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth()+1,0).getDate();};
const isLastWeek=()=>new Date().getDate()>daysInMonth()-7;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const seasonNow=()=>{const m=new Date().getMonth()+1;return m>=3&&m<=5?"spring":m>=6&&m<=8?"summer":m>=9&&m<=11?"autumn":"winter";};

/* ========== 저장 ========== */
const APP_VER="2026-09-30 · 9";
const KEY="quest-state-v1";
const blank=()=>({
  v:2, who:null, pin:{child:"",parent:""}, season:thisMonth(), score:0, stars:0,
  streak:{last:"",days:0,best:0}, missions:[], done:{}, monthDone:[], pending:[],

/* 인증 사진 유틸 */
function shrink(file,max=720,q=.55){
  return new Promise(res=>{
    const r=new FileReader();
    r.onload=()=>{ const im=new Image();
      im.onload=()=>{ const sc=Math.min(1,max/Math.max(im.width,im.height));
        const c=document.createElement("canvas"); c.width=Math.round(im.width*sc); c.height=Math.round(im.height*sc);
        c.getContext("2d").drawImage(im,0,0,c.width,c.height);
        let out=c.toDataURL("image/jpeg",q); if(out.length>160000) out=c.toDataURL("image/jpeg",.4); res(out); };
      im.onerror=()=>res(""); im.src=r.result; };
    r.onerror=()=>res(""); r.readAsDataURL(file);
  });
}
function pickPhoto(){
  return new Promise(res=>{
    const inp=$("#proofpick"); inp.value="";
    const on=async e=>{ inp.removeEventListener("change",on); const f=e.target.files[0]; res(f?await shrink(f):""); };
    inp.addEventListener("change",on); inp.click();
  });
}
function openPhoto(src){
  const box=el(`<div id="ask"><div class="askbox" style="max-width:92%;padding:12px"><img src="${src}" alt="인증 사진" style="width:100%;border-radius:14px;border:2.5px solid var(--plum)"><div class="row"><button class="btn alt" data-a>닫기</button></div></div></div>`);
  box.querySelector("[data-a]").onclick=()=>box.remove();
  box.addEventListener("click",e=>{if(e.target===box)box.remove();});
  $("#stage").appendChild(box);
}

/* 실제 시각에 따른 하늘 · 해와 달 */
function skyNow(){
  const d=new Date(), h=d.getHours()+d.getMinutes()/60;
  if(h>=5.5&&h<7.5) return {p:"dawn",h};
  if(h>=7.5&&h<17) return {p:"day",h};
  if(h>=17&&h<19.5) return {p:"dusk",h};
  return {p:"night",h};
}
const SKYSET={
  girl:{day:["#8fd3ff","#eaf7ff"],dawn:["#ffc9e0","#ffe9d6"],dusk:["#ff9e7a","#ffd9b0"],night:["#1f2352","#4a5390"]},
  boy:{day:["#7fb0ff","#dbe9ff"],dawn:["#b49ae8","#ffdcc8"],dusk:["#6b5aa8","#ffb38a"],night:["#2f2a5e","#6b5aa8"]}
};
function moonPhase(){ const d=Date.now()/86400000; return ((d-10.3)/29.530588853)%1; }
function celestial(){
  const {p,h}=skyNow();
  const day=(p!=="night");
  const t=day?Math.min(1,Math.max(0,(h-5.5)/(19.5-5.5))):((h>=19.5?h-19.5:h+4.5)/10);
  const x=Math.round(52+t*296), y=Math.round(232-Math.sin(Math.max(0,Math.min(1,t))*Math.PI)*92);
  if(day){
    const warm=(p==="dawn"||p==="dusk");
    return `<g transform="translate(${x} ${y})"><circle r="30" fill="${warm?"#ffd08a":"#fff1a6"}" ${OL}/>
      <circle cx="-9" cy="-9" r="7" fill="#fff" opacity=".65"/>
      <circle cx="-10" cy="4" r="2.5" fill="${P}"/><circle cx="10" cy="4" r="2.5" fill="${P}"/><path d="M-5 10 Q0 14 5 10" fill="none" ${OL} stroke-width="2.2"/></g>`;
  }
  const k=moonPhase(), sky=SKYSET[S.who==="boy"?"boy":"girl"].night[0];
  let shade="";
  if(k<0.08||k>0.92) shade=`<circle r="28" fill="${sky}"/>`;                        // 그믐(거의 안 보임)
  else if(k<0.22) shade=`<circle cx="14" r="28" fill="${sky}"/>`;                    // 초승달
  else if(k<0.30) shade=`<rect x="-30" y="-30" width="30" height="60" fill="${sky}"/>`; // 상현
  else if(k<0.45) shade=`<circle cx="-22" r="28" fill="${sky}"/>`;
  else if(k<0.55) shade="";                                                          // 보름
  else if(k<0.70) shade=`<circle cx="22" r="28" fill="${sky}"/>`;
  else if(k<0.80) shade=`<rect x="0" y="-30" width="30" height="60" fill="${sky}"/>`; // 하현
  else shade=`<circle cx="-14" r="28" fill="${sky}"/>`;
  return `<g transform="translate(${x} ${y})"><g><circle r="28" fill="#fff1c9" ${OL}/>${shade}</g>
    <circle r="28" fill="none" ${OL}/><circle cx="-9" cy="-7" r="5" fill="#ecdca8" opacity=".8"/><circle cx="7" cy="8" r="4" fill="#ecdca8" opacity=".7"/></g>`;
}

function bubbleAt(text,x,y){
  const t=text.length>16?text.slice(0,16)+"…":text, w=t.length*13.5+28;
  const bx=Math.min(Math.max(x,w/2+16),384-w/2);
  return `<g transform="translate(${bx} ${y})" pointer-events="none"><rect x="${-w/2}" y="-20" width="${w}" height="38" rx="17" fill="#fff" ${OL}/>
    <path d="M${x-bx-8} 16 L${x-bx} 28 L${x-bx+8} 16" fill="#fff" ${OL}/><rect x="${x-bx-9}" y="13" width="18" height="5" fill="#fff"/>
    <text y="5" text-anchor="middle" font-family="Jua, sans-serif" font-size="14" fill="${P}">${esc(t)}</text></g>`;
}
function petSpeech(){ return petBubble?bubbleAt(petBubble,S.who==="boy"?112:210,S.who==="boy"?560:556):""; }
function speech(){
  if(S.praise.seen || !S.praise.msg) return "";
  const t=S.praise.msg.length>13?S.praise.msg.slice(0,13)+"…":S.praise.msg, w=t.length*15+30;
  const x=Math.min(Math.max(S.who==="boy"?200:300,w/2+16),384-w/2);
  return `<g transform="translate(${x} ${S.who==="boy"?480:470})" class="hot" data-act="praise" tabindex="0" role="button" aria-label="칭찬 메시지">
    <rect x="${-w/2}" y="-20" width="${w}" height="38" rx="17" fill="#fff" ${OL}/><path d="M-8 16 L0 28 L8 16" fill="#fff" ${OL}/><rect x="-9" y="13" width="18" height="5" fill="#fff"/>
    <text y="5" text-anchor="middle" font-family="Jua, sans-serif" font-size="15" fill="${P}">${esc(t)}</text></g>`;
}
function fitScene(){
  const el2=$("#scene"); if(!el2) return;

  const H=Math.max(420,Math.min(1200,Math.round(400*r.height/r.width)));

function ask(msg,ok="네",no="아니요"){
  return new Promise(res=>{
    const box=el(`<div id="ask" role="alertdialog" aria-modal="true"><div class="askbox"><p></p><div class="row"><button class="btn alt" data-a="no">${no}</button><button class="btn pink" data-a="ok">${ok}</button></div></div></div>`);
    box.querySelector("p").textContent=msg;
    const done=v=>{box.remove();res(v);};
    box.querySelector('[data-a="ok"]').onclick=()=>done(true);
    box.querySelector('[data-a="no"]').onclick=()=>done(false);
    box.addEventListener("click",e=>{if(e.target===box)done(false);});
    $("#stage").appendChild(box);
  });

let petBubble="";
function petHint(){
  const left=todayLeft(), wait=S.pending.length;
  if(left>0) return `오늘 할 일 ${left}개 남았어!`;
  if(wait>0) return "부모님 승인 기다리는 중!";
  if(choreLeft()) return S.who==="boy"?"성 순찰 아직 안 했어!":"집안일 아직 안 했어!";
  if(S.who==="boy"){
    const power=S.hero.weapon+S.hero.armor+(S.castle.deco.includes("statue")?1:0);
    if(isLastWeek()&&!S.hero.boss) return power>=bossNeed()?"보스 잡으러 가자!":`보스까지 전투력 ${bossNeed()-power} 부족해!`;
    if(huntLeft()>0) return `오늘 사냥 ${huntLeft()}번 남았어!`;
    return pick(["오늘도 멋졌어!","강해지고 있구나!","내일도 같이 가자!"]);
  }
  if(isLastWeek()&&!S.tree.done) return S.tree.stage>=treeMax()?"열매 맺기 도전하자!":`나무가 ${treeMax()-S.tree.stage}단계 더 자라야 해!`;
  if(S.farm.plots.slice(0,plotCount()).some(p=>p&&p.stage>=3)) return "밭에 다 자란 게 있어!";
  return pick(["오늘도 잘했어!","같이 놀자!","물 주는 거 잊지 마!"]);
}

  bindBack(body);

  body.querySelectorAll("[data-yes]").forEach(b=>b.onclick=()=>{

    S.pending.splice(i,1);gain(p.rw);
    if(p.kind!=="req"){

function updateStreak(){
  const d=today(),dl=S.missions.filter(m=>m.type==="daily").map(m=>m.id),done=S.done[d]||[];
  if(!dl.length||!dl.every(id=>done.includes(id))) return;
  if(S.streak.last===d) return;
  const y=new Date(Date.now()-86400000),yd=`${y.getFullYear()}-${pad(y.getMonth()+1)}-${pad(y.getDate())}`;
  S.streak.days=S.streak.last===yd?S.streak.days+1:1;
  S.streak.last=d;S.streak.best=Math.max(S.streak.best,S.streak.days);
  if(S.streak.days===3||S.streak.days===7||S.streak.days%7===0){
    const bonus=S.streak.days>=7?5:3;S.score+=bonus;S.stars+=bonus;
    toast(`${S.streak.days}일 연속 달성! 보너스 ${bonus}점`);
  }
}

  if(!d) return `<div class="card"><h3>${name}</h3><div class="meta">아직 연결되지 않았어요. 아이 휴대폰에서 가족 코드 ${LINK.code} 를 넣어주세요.</div></div>`;
  const cur=S,keep=parWho;
  S=Object.assign(blank(),d); const p=pay(),g=grade(),n=nextGrade(),ch=challengeDone(),w2=weekStats(),mx=Math.max(1,...w2);
  const wait=(d.pending||[]).length,left=todayLeft();
  const html=`<div class="card"><h3>${name} · <span class="pill">${g.name}</span></h3>
    <div class="tagline"><span class="tag">${d.score||0}점</span><span class="tag">${won(p.total)}</span><span class="tag${ch?" done":" lock"}">도전 ${ch?"성공":"진행 중"}</span><span class="tag">오늘 남은 할일 ${left}개</span></div>
    <div class="wk" style="height:80px">${w2.map((v,i)=>`<div><i style="height:${Math.round(v/mx*100)}%"></i>${i+1}주</div>`).join("")}</div>
    <div class="meta">${n?`${n.name}까지 ${n.left}점`:"최고 등급"} · 연속 ${(d.streak||{}).days||0}일</div>
    <div class="row" style="margin-top:8px"><button class="btn sm pink" data-k="${w}" data-v="approve">승인 ${wait?`(${wait})`:""}</button>
      <button class="btn sm alt" data-k="${w}" data-v="missions">미션</button>
      <button class="btn sm alt" data-k="${w}" data-v="pay">용돈</button>
      <button class="btn sm alt" data-k="${w}" data-v="report">리포트</button></div></div>`;
  S=cur; parWho=keep; return html;
}
function renderParentHome(){
  const h=$("#phome"); if(!h) return;
  h.innerHTML=`<div class="pwrap"><h1>부모 화면</h1>
    <p class="sub">가족 코드 <b>${LINK.code}</b> · 아이 휴대폰에서 이 코드를 넣으면 연결돼요</p>
    ${kidCard("girl")}${kidCard("boy")}
    <p class="sub" style="opacity:.6;font-size:12px">앱 버전 ${APP_VER}</p>
    <div class="row"><button class="btn alt sm" data-act="copy">코드 복사</button><button class="btn alt sm" data-act="tochild">이 휴대폰을 아이용으로</button><button class="btn alt sm" data-act="unlink">연결 해제</button></div></div>`;
  h.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>openKid(b.dataset.k,b.dataset.v));
  h.querySelector('[data-act="copy"]').onclick=async()=>{try{await navigator.clipboard.writeText(LINK.code);toast("코드를 복사했어요");}catch(e){toast(LINK.code);}};
  h.querySelector('[data-act="tochild"]').onclick=async()=>{
    if(!await ask("이 휴대폰을 아이용 화면으로 바꿀까요?\n같은 가족 코드로 다시 연결돼요.","바꾸기","취소"))return;
    clearSubs(); parWho=""; $("#phome").remove();
    $("#scene").style.display=""; $("#hud").style.display=""; $("#menu").style.display="";
    S=blank(); save(false); chooseStart(true);
  };
  h.querySelector('[data-act="unlink"]').onclick=async()=>{
    if(!await ask("이 휴대폰에서 가족 연결을 해제할까요?","해제","취소"))return;
    clearSubs();LINK={mode:"local",code:"",who:""};saveLink();location.reload();
  };
}
function openKid(w,view){
  if(!PAR[w]) return toast("아직 아이 휴대폰이 연결되지 않았어요");
  parWho=w; S=Object.assign(blank(),PAR[w]);
  const fn={approve:renderApprove,missions:renderMissionAdmin,pay:renderPay,report:renderReport}[view];
  openSheet(w==="boy"?"아들":"딸","#9f7ff0",body=>fn(body));
}

/* ========== 시작 ========== */
function gateCard(html){$("#gate").innerHTML=`<div class="gatecard">${html}</div>`;$("#gate").style.display="flex";}
function hideGate(){$("#gate").style.display="none";}
function chooseCharacter(){
  gateCard(`<h1>한 달 모험</h1><p class="sub">누구의 휴대폰인가요?</p>
    <div class="picks"><button class="pick" data-w="girl"><svg viewBox="-66 -176 132 180">${girlChar()}</svg>여자 캐릭터<br><span style="font-size:13px;opacity:.7">농장·나무 키우기</span></button>
    <button class="pick" data-w="boy"><svg viewBox="-66 -176 132 180">${boyChar(3,3)}</svg>남자 캐릭터<br><span style="font-size:13px;opacity:.7">강화·보스 사냥</span></button></div>`);
  $("#gate").querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{S.who=b.dataset.w;S.pay=JSON.parse(JSON.stringify(PAY_PRESET[S.who]));save();setupPins();});
}
function setupPins(){
  gateCard(`<h1>비밀번호 정하기</h1><p class="sub">부모님이 한 번만 정해주세요</p>
    <label class="field"><span>아이 비밀번호 (비워도 돼요)</span><input data-f="child" inputmode="numeric" maxlength="8"></label>
    <label class="field"><span>부모 비밀번호</span><input data-f="parent" inputmode="numeric" maxlength="8" placeholder="예: 1234"></label>
    <div class="row"><button class="btn pink" data-ok>시작하기</button></div>`);
  $("#gate").querySelector("[data-ok]").onclick=()=>{
    const pc=$("#gate").querySelector('[data-f="child"]').value.trim(),pp=$("#gate").querySelector('[data-f="parent"]').value.trim();
    if(!pp)return toast("부모 비밀번호를 정해주세요");
    S.pin={child:pc,parent:pp};
    DEFAULT_MISSIONS[S.who].forEach(d=>S.missions.push({id:uid2(),...d}));
    save();hideGate();refresh();
    toast("기본 미션을 넣어뒀어요");
    setTimeout(()=>toast("부모 메뉴는 왼쪽 위 점수 칸을 길게 누르면 열려요"),2600);
  };
}
function childGate(){
  gateCard(`<h1>한 달 모험</h1><p class="sub">비밀번호를 넣어주세요</p><label class="field"><span>비밀번호</span><input type="password" inputmode="numeric" autocomplete="off"></label>
    <div class="row"><button class="btn pink" data-ok>들어가기</button></div>`);
  const inp=$("#gate").querySelector("input");
  const go=()=>{if(inp.value===S.pin.child||inp.value===S.pin.parent){hideGate();refresh();}else{toast("비밀번호가 달라요");inp.value="";}};
  $("#gate").querySelector("[data-ok]").onclick=go;
  inp.addEventListener("keydown",e=>{if(e.key==="Enter")go();});
  setTimeout(()=>inp.focus(),60);
}
function chooseStart(toChild){
  if(toChild) return childJoinScreen();
  gateCard(`<h1>한 달 모험</h1><p class="sub">이 휴대폰은 누가 쓰나요?</p>
    <div class="row" style="flex-direction:column"><button class="btn pink" data-s="parent" style="width:100%">부모 휴대폰 (가족 만들기)</button>
      <button class="btn" data-s="child" style="width:100%">아이 휴대폰 (가족 코드 넣기)</button>
      <button class="btn alt" data-s="local" style="width:100%">연결 없이 이 기기에만 저장</button></div>
    <p class="help" style="margin-top:12px">가족으로 연결하면 아이가 미션을 완료했을 때 부모 휴대폰에서 바로 승인할 수 있어요.</p>`);
  $("#gate").querySelectorAll("[data-s]").forEach(b=>b.onclick=async()=>{
    if(b.dataset.s==="local"){LINK={mode:"local",code:"",who:""};saveLink();return chooseCharacter();}
    if(b.dataset.s==="parent"){
      toast("가족을 만드는 중…");
      const code=await fbCreateFamily(); if(!code)return;
      gateCard(`<h1>가족 코드</h1><p class="sub">아이 휴대폰에서 이 코드를 넣어주세요</p><p class="big" style="font-size:30px;letter-spacing:2px">${code}</p>
        <div class="row"><button class="btn alt" data-c>코드 복사</button><button class="btn pink" data-go>부모 화면으로</button></div>`);
      $("#gate").querySelector("[data-c]").onclick=async()=>{try{await navigator.clipboard.writeText(code);toast("복사했어요");}catch(e){}};
      $("#gate").querySelector("[data-go]").onclick=()=>parentMode();
      return;
    }
    return childJoinScreen();
  });
}
function childJoinScreen(){
    gateCard(`<h1>가족 코드 넣기</h1><p class="sub">부모님 휴대폰에 나온 코드를 적어주세요</p>
      <label class="field"><span>가족 코드</span><input data-f="code" maxlength="9" placeholder="ABCD-1234" style="text-transform:uppercase"></label>
      <p class="sub">누구의 휴대폰인가요?</p>
      <div class="picks"><button class="pick" data-w="girl"><svg viewBox="-66 -176 132 180">${girlChar()}</svg>여자</button>
        <button class="pick" data-w="boy"><svg viewBox="-66 -176 132 180">${boyChar(3,3)}</svg>남자</button></div>
      <div class="row"><button class="btn alt" data-back>뒤로</button></div>`);
    const pre=$("#gate").querySelector('[data-f="code"]'); if(LINK.code) pre.value=LINK.code;
    let picked="";
    $("#gate").querySelectorAll("[data-w]").forEach(x=>x.onclick=async()=>{
      picked=x.dataset.w;
      const code=$("#gate").querySelector('[data-f="code"]').value.trim().toUpperCase();
      if(!code)return toast("가족 코드를 넣어주세요");
      toast("연결하는 중…");
      const r=await fbJoin(code,picked);
      if(r==="none")return toast("그런 가족 코드가 없어요");
      if(r==="full")return toast("연결할 수 있는 기기를 다 썼어요");
      if(r==="net")return;
      S.who=picked; S.pay=JSON.parse(JSON.stringify(PAY_PRESET[picked]));
      let remote=null; try{ const d=await kidRef(picked).get(); if(d.exists) remote=d.data(); }catch(e){}
      if(remote && (remote.missions||[]).length){
        if(await ask("가족에 저장된 내용이 있어요. 그걸 가져올까요?\n아니요를 누르면 이 휴대폰 내용을 올려요.","가져오기","이 기기 내용 올리기")) S=Object.assign(blank(),remote);
      }
      save(); listenChild();
      if(!S.missions.length) DEFAULT_MISSIONS[picked].forEach(d=>S.missions.push({id:uid2(),...d}));
      if(!S.pin.parent) return setupPins();
      hideGate(); refresh(); toast("가족과 연결됐어요!");
    });
    $("#gate").querySelector("[data-back]").onclick=()=>chooseStart();
}
function start(){
  rollSeason();
  if(LINK.mode==="parent")return parentMode();
  if(LINK.mode==="child"){ fbInit().then(ok=>{ if(ok) listenChild(); }); }
  if(LINK.mode!=="child"&&!S.who&&!S.missions.length)return chooseStart();
  if(!S.who)return chooseCharacter();
  if(!S.pin.parent)return setupPins();
  if(S.pin.child)return childGate();
  hideGate();refresh();
}
load();start();
</script>
